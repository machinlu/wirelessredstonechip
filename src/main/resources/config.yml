# WirelessRedstone Configuration

debug-messages: false
default-language: "en_us"

messages:
  # ==========================================
  # 🇻🇳 Tiếng Việt (vi_vn)
  # ==========================================
  vi_vn:
    prefix: "<gray>[<gradient:gold:yellow>WirelessRedstone</gradient>] </gray>"
    no-permission: "<red>Bạn không có quyền sử dụng lệnh này!</red>"
    only-player: "<red>Lệnh này chỉ có thể sử dụng bởi người chơi!</red>"

    commands:
      givechip:
        usage: "<yellow>Cú pháp: /givechip <sender|receiver> [signal_id]</yellow>"
        invalid-type: "<red>Loại chip phải là 'sender' hoặc 'receiver'!</red>"
        success: "<green>Đã nhận <yellow><chip_type></yellow> với Signal ID: <yellow><signal_id></yellow></green>"

      wrclear:
        success: "<green>Đã quét sạch <yellow><count></yellow> chip khỏi RAM và data.yml thành công!</green>"

    events:
      place-receiver: "<green>Đã đặt Chip Thu (ID: <yellow><signal_id></yellow>) tại (<x>, <y>, <z>)</green>"
      place-sender: "<yellow>Đã đặt Chip Phát (ID: <green><signal_id></green>) tại (<x>, <y>, <z>)</yellow>"
      break-chip: "<red>Đã gỡ <type> (ID: <yellow><signal_id></yellow>) ra khỏi khối!</red>"

    items:
      sender-name: "<!italic><yellow>[Chip Phát] <white><italic><signal_id></italic></white></yellow>"
      receiver-name: "<!italic><green>[Chip Thu] <white><italic><signal_id></italic></white></green>"
      chip-description: "<!italic><gray><italic>Gắn chip này vào khối để kết nối không dây</italic></gray>"
      signal-id-lore: "<!italic><gray>Signal ID: <aqua><italic><signal_id></italic></aqua></gray>"
      attached-sender-lore: "<!italic><yellow>[Gắn Chip Phát | Signal: <white><signal_id></white>]</yellow>"
      attached-receiver-lore: "<!italic><yellow>[Gắn Chip Thu | Signal: <white><signal_id></white>]</yellow>"

  # ==========================================
  # 🇬🇧 English / International (en_us)
  # ==========================================
  en_us:
    prefix: "<gray>[<gradient:gold:yellow>WirelessRedstone</gradient>] </gray>"
    no-permission: "<red>You do not have permission to use this command!</red>"
    only-player: "<red>This command can only be used by players!</red>"

    commands:
      givechip:
        usage: "<yellow>Usage: /givechip <sender|receiver> [signal_id]</yellow>"
        invalid-type: "<red>Chip type must be 'sender' or 'receiver'!</red>"
        success: "<green>Received <yellow><chip_type></yellow> with Signal ID: <yellow><signal_id></yellow></green>"

      wrclear:
        success: "<green>Successfully cleared <yellow><count></yellow> chips from RAM and data.yml!</green>"

    events:
      place-receiver: "<green>Placed Receiver Chip (ID: <yellow><signal_id></yellow>) at (<x>, <y>, <z>)</green>"
      place-sender: "<yellow>Placed Transmitter Chip (ID: <green><signal_id></green>) at (<x>, <y>, <z>)</yellow>"
      break-chip: "<red>Removed <type> (ID: <yellow><signal_id></yellow>) from the block!</red>"

    items:
      sender-name: "<!italic><yellow>[Transmitter Chip] <white><italic><signal_id></italic></white></yellow>"
      receiver-name: "<!italic><green>[Receiver Chip] <white><italic><signal_id></italic></white></green>"
      chip-description: "<!italic><gray><italic>Attach this chip to a block for wireless connection</italic></gray>"
      signal-id-lore: "<!italic><gray>Signal ID: <aqua><italic><signal_id></italic></aqua></gray>"
      attached-sender-lore: "<!italic><yellow>[Transmitter Attached | Signal: <white><signal_id></white>]</yellow>"
      attached-receiver-lore: "<!italic><yellow>[Receiver Attached | Signal: <white><signal_id></white>]</yellow>"